plugins { id 'com.android.application' }

def buildVersionName = providers.gradleProperty('releaseVersionName').orElse('0.1.0').get()
def buildVersionCode = providers.gradleProperty('releaseVersionCode').orElse('1').get()
if (!(buildVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?/) || buildVersionName.length() > 100) {
    throw new GradleException('releaseVersionName must have a form such as 0.1.0 or 0.1.0-beta.1')
}
if (!(buildVersionCode ==~ /[0-9]+/) || buildVersionCode.toBigInteger() < 1 || buildVersionCode.toBigInteger() > 2100000000) {
    throw new GradleException('releaseVersionCode must be between 1 and 2100000000')
}
def signingVariables = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def missingSigningVariables = signingVariables.findAll { !System.getenv(it) }
def hasReleaseSigning = missingSigningVariables.isEmpty()
if (providers.gradleProperty('requireReleaseSigning').orElse('false').get().toBoolean() && !hasReleaseSigning) {
    throw new GradleException('Release signing is missing: ' + missingSigningVariables.join(', '))
}

android {
    namespace 'at.robin.metro'
    compileSdk 36
    defaultConfig {
        applicationId 'at.robin.metro'
        minSdk 26
        targetSdk 36
        versionCode buildVersionCode.toInteger()
        versionName buildVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
